{% extends 'base.html' %}

{% if mode == 'edit' %}
  {% set page_title = 'Editar cliente' %}
{% else %}
  {% set page_title = 'Nuevo cliente' %}
{% endif %}

{% block title %}{{ page_title }} | Administrador{% endblock %}

{% block content %}
<section class="form-card">
  <h2>{{ page_title }}</h2>
  <form method="POST" class="product-form">
    <label>
      Nombre
      <input type="text" name="name" value="{{ client.name or '' }}" required maxlength="120" />
    </label>

    <label>
      Correo electrónico
      <input type="email" name="email" value="{{ client.email or '' }}" required maxlength="160" />
    </label>

    <div class="grid-2">
      <label>
        Teléfono
        <input type="text" name="phone" value="{{ client.phone or '' }}" maxlength="40" />
      </label>

      <label>
        Empresa
        <input type="text" name="company" value="{{ client.company or '' }}" maxlength="120" />
      </label>
    </div>

    <label>
      Notas
      <textarea name="notes" rows="4" maxlength="500">{{ client.notes or '' }}</textarea>
    </label>

    <div class="actions">
      <button class="button" type="submit">Guardar</button>
      <a class="button ghost" href="{{ url_for('index') }}">Cancelar</a>
    </div>
  </form>
</section>
{% endblock %}
