{% extends 'base.html' %}

{% if mode == 'edit' %}
  {% set page_title = 'Editar producto' %}
{% else %}
  {% set page_title = 'Nuevo producto' %}
{% endif %}

{% block title %}{{ page_title }} | Administrador{% endblock %}

{% block content %}
<section class="form-card">
  <h2>{{ page_title }}</h2>
  <form method="POST" class="product-form">
    <label>
      SKU
      <input type="text" name="sku" value="{{ product.sku or '' }}" required maxlength="64" />
    </label>

    <label>
      Nombre
      <input type="text" name="name" value="{{ product.name or '' }}" required maxlength="120" />
    </label>

    <label>
      Descripción
      <textarea name="description" rows="3" maxlength="500">{{ product.description or '' }}</textarea>
    </label>

    <label>
      Categoría
      <input type="text" name="category" value="{{ product.category or '' }}" maxlength="80" />
    </label>

    <div class="grid-2">
      <label>
        Precio
        <input type="number" name="price" value="{{ product.price or '' }}" min="0" step="0.01" required />
      </label>

      <label>
        Impuesto (%)
        <input type="number" name="tax" value="{{ product.tax or '0' }}" min="0" max="100" step="0.01" required />
      </label>
    </div>

    <div class="grid-2">
      <label>
        Stock
        <input type="number" name="stock" value="{{ product.stock or '' }}" min="0" step="1" required />
      </label>
    </div>

    <div class="actions">
      <button class="button" type="submit">Guardar</button>
      <a class="button ghost" href="{{ url_for('index') }}">Cancelar</a>
    </div>
  </form>
</section>
{% endblock %}
